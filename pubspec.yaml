name: books_tracker
description: Book Tracker — Clean Architecture + Local Storage
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.2
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ─────────────────────────────────────────────────────────────
#  App Icons — run after saving:
#  dart run flutter_launcher_icons
# ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ─────────────────────────────────────────────────────────────
#  Native splash — run this command after saving:
#  dart run flutter_native_splash:create
#
#  To undo:
#  dart run flutter_native_splash:remove
# ─────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#1A1A2E"
  fullscreen: true
  android: true
  ios: true
  web: false
  android_12:
    color: "#1A1A2E"
    icon_background_color: "#1A1A2E"